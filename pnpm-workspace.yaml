# The workspace, for pnpm.
#
# `packages` mirrors package.json's own `workspaces` field, which npm reads and pnpm does
# not. Without it pnpm treats this repo as one package and never links
# `@ai-director/contract` into apps/backend and apps/frontend, so every
# `import ... from "@ai-director/contract"` fails to resolve. The symlinks under
# node_modules/@ai-director were left behind by npm; pnpm needs to be told.
packages:
  - packages/*
  - apps/*

# Which dependencies may run install scripts.
#
# pnpm 11 blocks all of them by default and writes this list with a placeholder rather than
# choosing for you, which is the right default: an install script runs arbitrary code on
# this machine.
#
# esbuild is allowed because its postinstall is what fetches and links the platform-native
# binary (`@esbuild/darwin-arm64`). Vite, Vitest and tsx all shell out to that binary, so
# with the script blocked the dev server, the test suite and the CLIs all fail at startup
# rather than at some later edge. It is a first-party script from the esbuild package
# itself, doing the one thing esbuild cannot ship prebuilt.
allowBuilds:
  # Declined. Neither fetches a platform-native binary the way esbuild does: protobufjs's
  # postinstall wires up its optional CLI dependencies, and @google/genai's runs a bundling
  # step it also ships prebuilt. Verified after declining that the backend still boots, the
  # avatar routes still answer and the whole suite still passes, which is the only reason
  # to believe a skipped script was skippable.
  '@google/genai': false
  esbuild: true
  protobufjs: false

# Why there is no `nodeLinker` here, and no .npmrc any more.
#
# This repo carried `node-linker=hoisted` in .npmrc, asking pnpm for the flat tree npm builds.
# It was added because pnpm's isolated layout broke the Playwright suite once: the runner and the
# spec files resolved two different copies of `@playwright/test`, `test.describe` threw
# "Playwright Test did not expect test.describe() to be called here", and all 31 browser tests
# reported "No tests found".
#
# pnpm 11 does not read its settings from .npmrc, so that line had stopped being in effect:
# `pnpm config get node-linker` answers `undefined`, and node_modules on disk is the isolated
# layout — symlinks into `.pnpm` — with pnpm's default hoist pattern behind it. The 599 unit and
# jsdom tests pass on that layout. The only thing the line still did was make every npm command
# print `Unknown project config "node-linker"` twice, so it is gone rather than moved.
#
# If the duplicate-instance fault ever returns, `nodeLinker: hoisted` in this file is the live
# equivalent of what .npmrc used to ask for. Verify the browser suite either side of setting it,
# since that suite is the only reason to want it.
